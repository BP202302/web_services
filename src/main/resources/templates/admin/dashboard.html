<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Admin - Dashboard')"></head>
<body>
<nav th:replace="fragments/header :: navbar"></nav>
<div class="container my-5">
    <h1 class="fw-bold mb-4">Panel de Administracion</h1>
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card bg-primary text-white shadow">
                <div class="card-body text-center">
                    <h2 th:text="${totalGasolineras}">0</h2>
                    <p>Gasolineras</p>
                    <a th:href="@{/admin/gasolineras}" class="btn btn-light btn-sm">Gestionar</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-warning text-dark shadow">
                <div class="card-body text-center">
                    <h2 th:text="${totalPrecios}">0</h2>
                    <p>Precios Vigentes</p>
                    <a th:href="@{/admin/precios}" class="btn btn-dark btn-sm">Gestionar</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-success text-white shadow">
                <div class="card-body text-center">
                    <h2 th:text="${totalTipos}">0</h2>
                    <p>Tipos de Combustible</p>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
