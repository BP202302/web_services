<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Admin - Nuevo Precio')"></head>
<body>
<nav th:replace="fragments/header :: navbar"></nav>
<div class="container my-5">
    <h1 class="fw-bold mb-4">Registrar Nuevo Precio</h1>
    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/admin/precios/guardar}" th:object="${precio}" method="post">
                <div class="mb-3">
                    <label class="form-label">Gasolinera</label>
                    <select class="form-select" th:field="*{gasolinera.id}" required>
                        <option value="">-- Seleccione --</option>
                        <option th:each="g : ${gasolineras}" th:value="${g.id}" th:text="${g.nombre}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Tipo de Combustible</label>
                    <select class="form-select" th:field="*{tipoCombustible.id}" required>
                        <option value="">-- Seleccione --</option>
                        <option th:each="t : ${tipos}" th:value="${t.id}" th:text="${t.nombre}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Precio por Galon (USD)</label>
                    <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{precioGalon}" required/>
                </div>
                <button type="submit" class="btn btn-primary">Guardar Precio</button>
                <a th:href="@{/admin/precios}" class="btn btn-outline-secondary ms-2">Cancelar</a>
            </form>
        </div>
    </div>
</div>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
