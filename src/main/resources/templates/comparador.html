<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('CombustiSV - Comparador')"></head>
<body>
<nav th:replace="fragments/header :: navbar"></nav>
<div class="container my-5">
    <h1 class="fw-bold mb-4">Comparador de Precios</h1>
    <p class="text-muted">Compara los precios de todas las gasolineras registradas lado a lado.</p>
    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle text-center">
            <thead class="table-dark">
                <tr><th>Gasolinera</th><th>Marca</th><th>Tipo</th><th>Precio/Galon</th><th>Fecha</th></tr>
            </thead>
            <tbody>
                <tr th:each="p : ${precios}">
                    <td th:text="${p.gasolinera.nombre}"></td>
                    <td th:text="${p.gasolinera.marca}"></td>
                    <td th:text="${p.tipoCombustible.nombre}"></td>
                    <td class="fw-bold" th:text="'$' + ${p.precioGalon}"></td>
                    <td th:text="${p.fechaActualizacion}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
