# =============================================
# CombustiSV - Configuracion de la Aplicacion
# =============================================

# Servidor
server.port=8080
server.servlet.context-path=/combustisv

# Base de Datos MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/combustisv_db?useSSL=false&serverTimezone=America/El_Salvador&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Logging
logging.level.com.combustisv=DEBUG
